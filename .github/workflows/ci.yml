name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: install-python-test-dependency
        run: python -m pip install pytest

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15

      - name: test
        run: go test ./... -count=1

      - name: python-tests
        working-directory: connectors/python
        run: python -m pytest

      # STATUS: PASS | TIER: T1 | EVIDENCE: none:worker-branch-local-controls
      # ch:trace row=QA-GUARD-007 spec=.github/workflows/ci.yml wave=.coding-hermes/waves/guard-foreman-2026-11-15-16-29-26.json#QA-GUARD-007 test=connectors/python/test_guard_client.py doc=.github/workflows/ci.yml evidence=none:worker-branch-local-controls witness=none:worker-branch verdict=none:pending-tier2 commit=none:worker-commit memory=none:not-written
      - name: docs-check
        run: make docs-check

      - name: gitleaks
        # gitleaks-action@v2 requires a paid license on org repos; use the
        # pinned binary instead (INT-CI-1, run 36999031002). Extract to /tmp:
        # the tarball ships its own README.md which would clobber the repo's
        # and trip the scanner (run 36999603133).
        run: |
          mkdir -p /tmp/gitleaks-bin
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp/gitleaks-bin
          /tmp/gitleaks-bin/gitleaks detect --no-git -v --redact --exit-code 1
